services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autotube
      POSTGRES_USER: autotube
      POSTGRES_PASSWORD: autotube_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotube -d autotube"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  api:
    build: ./apps/backend
    environment:
      API_PORT: 8000
      DATABASE_URL: jdbc:postgresql://postgres:5432/autotube
      DATABASE_USERNAME: autotube
      DATABASE_PASSWORD: autotube_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
volumes:
  postgres_data:
  redis_data:
