server:
  port: ${API_PORT:8000}
spring:
  application:
    name: autotube-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/autotube}
    username: ${DATABASE_USERNAME:autotube}
    password: ${DATABASE_PASSWORD:autotube_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null
autotube:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  ai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
management:
  endpoints:
    web:
      exposure:
        include: health,info