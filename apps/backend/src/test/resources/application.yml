spring:
  datasource:
    url: jdbc:h2:mem:autotube;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
autotube:
  cors-origins: http://localhost:3000
  ai:
    api-key:
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
